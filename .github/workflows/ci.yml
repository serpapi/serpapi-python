# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: serpapi-python

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true

    - name: Install dependencies
      run: uv pip install -e '.[test]'

    - name: Run tests
      run: pytest tests --ignore-glob='tests/test_docs_*.py' -k "not example"
      env:
        API_KEY: ${{ secrets.API_KEY }}

    - name: Run example tests
      if: matrix.python-version == '3.15'
      run: pytest tests/example_search_*_test.py
      env:
        API_KEY: ${{ secrets.API_KEY }}
