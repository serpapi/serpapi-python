name: Release

on:
  push:
    tags: ['v**']
  workflow_dispatch:
    inputs:
      allow_example_test_failures:
        description: 'Publish even if the live example tests fail (use only when a SerpApi engine is down)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6

      - name: Ensure ref is a tag
        if: github.ref_type != 'tag'
        run: |
          echo "Release must run against a tag, got '${{ github.ref }}'" >&2
          exit 1

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        run: uv pip install -e '.[test]'

      - name: Run tests
        run: pytest --ignore=tests/test_docs_publishing.py -k "not example"
        env:
          API_KEY: ${{ secrets.API_KEY }}

      - name: Run engine and documentation examples
        if: matrix.python-version == '3.15'
        continue-on-error: ${{ inputs.allow_example_test_failures == true }}
        run: pytest --ignore=tests/test_docs_publishing.py -k "example" --require-docs-key
        env:
          API_KEY: ${{ secrets.API_KEY }}

  build:
    name: Build distribution
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  stubs-check:
    name: Check stubs
    uses: ./.github/workflows/stubs.yml

  stubs-series:
    name: Check for an existing stub release
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - id: check
        name: Require a matching tag and publish only once per SDK series
        run: python stubs/tools/release_version.py --series-check "$GITHUB_REF_NAME"

  stubs-build:
    name: Build stub distribution
    needs: [test, stubs-check, stubs-series]
    if: needs.stubs-series.outputs.publish == 'true'
    uses: ./.github/workflows/stubs-build.yml

  # Stubs are published first so that `serpapi[typing]` resolves as soon as the SDK is available.
  publish-stubs:
    name: Publish serpapi-stubs
    needs: [build, stubs-series, stubs-build]
    if: needs.stubs-series.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi-stubs
      url: https://pypi.org/p/serpapi-stubs
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: stubs-dist
          path: dist/

      - id: final-check
        name: Do not supersede an installable stub series
        run: python stubs/tools/release_version.py --series-check "$GITHUB_REF_NAME"

      - name: Publish to PyPI
        if: steps.final-check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

  publish:
    name: Publish release
    needs: [test, build, stubs-check, stubs-series, stubs-build, publish-stubs]
    # A status function is needed so skipped stub jobs do not skip this job; unlike `always()`,
    # `!cancelled()` still lets a cancelled run stop before the SDK is published.
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.stubs-check.result == 'success' &&
      needs.stubs-series.result == 'success' &&
      (needs.stubs-build.result == 'success' ||
       (needs.stubs-build.result == 'skipped' && needs.stubs-series.outputs.publish == 'false')) &&
      (needs.publish-stubs.result == 'success' ||
       (needs.publish-stubs.result == 'skipped' && needs.stubs-series.outputs.publish == 'false'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/serpapi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create ${{ github.ref_name }} dist/* --generate-notes \
            || gh release upload ${{ github.ref_name }} dist/* --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  smoke-test:
    name: Smoke test published package
    needs: [publish]
    # `publish` still runs when the stub jobs are skipped, but a plain `needs` would skip this job
    # because its grandparents were skipped.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Wait for PyPI availability
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Waiting for serpapi==$VERSION and its serpapi-stubs series on PyPI..."
          for i in $(seq 1 12); do
            if pip index versions serpapi 2>/dev/null | grep -q "$VERSION" \
              && pip index versions serpapi-stubs 2>/dev/null | grep -qF "$VERSION."; then
              echo "Available!"
              exit 0
            fi
            echo "Attempt $i/12 — sleeping 10s..."
            sleep 10
          done
          echo "Timed out waiting for PyPI propagation" && exit 1

      - name: Install from PyPI
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          pip install "serpapi==$VERSION"

      - name: Install typing extra
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          pip install "serpapi[typing]==$VERSION"
          pip show serpapi-stubs

      - name: Verify import and version
        env:
          API_KEY: ${{ secrets.API_KEY }}
          EXPECTED_VERSION: ${{ github.ref_name }}
        shell: python3 {0}
        run: |
          import os
          import serpapi
          expected = os.environ["EXPECTED_VERSION"].lstrip("v")
          assert serpapi.__version__ == expected, f"Version mismatch: {serpapi.__version__} != {expected}"
          print(f"OK: serpapi=={serpapi.__version__} installed successfully")
          client = serpapi.Client(api_key=os.environ["API_KEY"])
          results = client.search({"engine": "google", "q": "coffee"})
          assert results.get("organic_results"), "No organic results returned"
          print(f"OK: live search returned {len(results['organic_results'])} organic results")
