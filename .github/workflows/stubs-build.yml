name: Build serpapi-stubs

# Builds the stub distribution under its next release version and uploads it as the `stubs-dist` artifact.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build stub distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        working-directory: stubs
        run: |
          pip install build
          python tools/release_version.py
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: stubs-dist
          path: stubs/dist/
          if-no-files-found: error
