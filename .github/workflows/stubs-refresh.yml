name: Refresh serpapi-stubs

# Regenerates the engine snapshot and stubs from the SerpApi playground and opens (or updates) a PR.
# The PR is closed again if a later run finds that the stubs match the default branch.
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows, so set the
# STUBS_REFRESH_TOKEN secret (fine-grained PAT or GitHub App token) to run checks on the PR.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: serpapi-stubs-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH: bot/refresh-serpapi-stubs

jobs:
  refresh:
    name: Refresh stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.STUBS_REFRESH_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Fetch engine metadata
        run: python stubs/tools/fetch_engines.py

      - name: Regenerate stubs
        run: python stubs/tools/generate_stubs.py

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ secrets.STUBS_REFRESH_TOKEN || github.token }}
        run: |
          bot="github-actions[bot]"

          # Ignore fork PRs that happen to use the same branch name.
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')

          # A maintainer may have pushed fixes to the open refresh branch. Never discard those. An open pull
          # request always has its branch, so a failed fetch is an error and has to stop the run.
          branch_tip=""
          human_commits=false
          if [ -n "$open_pr" ]; then
            git fetch --quiet origin "$BRANCH"
            branch_tip=$(git rev-parse FETCH_HEAD)
            commit_authors=$(git log --format='%an/%cn' "HEAD..$branch_tip")
            if [ -n "$commit_authors" ] && grep -qFxv "$bot/$bot" <<< "$commit_authors"; then
              human_commits=true
            fi
          fi

          if [ "$human_commits" = true ]; then
            echo "::warning::origin/$BRANCH has commits that this workflow did not make, so pull request #$open_pr was left unchanged."
            exit 0
          fi

          if [ -z "$(git status --porcelain -- stubs/)" ]; then
            echo "Stubs are up to date."
            if [ -n "$open_pr" ]; then
              # Delete only the tip we inspected. If a maintainer pushed since the fetch,
              # the lease fails and the step stops before closing their PR.
              git push --force-with-lease="refs/heads/$BRANCH:$branch_tip" origin ":refs/heads/$BRANCH"
              gh pr close "$open_pr"
              # Deleting the head can already have closed the PR, so comment separately.
              gh pr comment "$open_pr" --body "Closed this refresh PR because the generated stubs now match the default branch."
            fi
            exit 0
          fi

          git config user.name "$bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add stubs/
          git commit -m "Refresh serpapi-stubs from the SerpApi playground"

          if [ -n "$open_pr" ]; then
            # Leave the branch and its checks alone when it already has these stubs, whatever else changed
            # on the default branch.
            if [ "$(git rev-parse 'HEAD:stubs')" = "$(git rev-parse "$branch_tip:stubs")" ]; then
              echo "Pull request #$open_pr already has these stubs."
              exit 0
            fi
            # The lease rejects the push if the branch changed after it was fetched above.
            git push --force-with-lease="$BRANCH:$branch_tip" origin "$BRANCH"
          else
            # Without an open PR the remote branch is left over from a merged or closed one. Updating it
            # would carry every change made to the default branch since then, and GitHub can refuse a
            # push that changes workflow files that way, so start from a fresh branch.
            git push --quiet origin --delete "$BRANCH" 2>/dev/null || true
            git push --force origin "$BRANCH"
          fi

          {
            echo "Automated weekly refresh of \`stubs/data/engines.json\` and the generated stubs."
            echo
            echo "Merging this PR publishes a new \`serpapi-stubs\` release when \`serpapi/\` is unchanged since the latest SDK tag; otherwise the stubs ship with the next SDK release."
            echo
            echo '```'
            git --no-pager diff --stat HEAD~1 HEAD
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "Refresh serpapi-stubs" --body-file "$RUNNER_TEMP/body.md"
          fi
