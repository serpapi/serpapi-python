version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    pre_build:
      - python -m scripts.check_docs_revision
    post_build:
      - python -m scripts.check_docs_revision

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - pdf
  - epub

python:
  install:
    - method: uv
      command: pip
      path: .
      extras:
        - docs
