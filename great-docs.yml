display_name: SerpApi Python
module: serpapi
parser: sphinx
dynamic: true

repo: https://github.com/serpapi/serpapi-python
site_url: https://serpapi.github.io/serpapi-python/
github_style: icon
pypi: true

source:
  enabled: true
  branch: master
  path: serpapi
  placement: title

authors:
  - name: SerpApi
    role: Author
    email: support@serpapi.com
    homepage: https://serpapi.com

logo:
  light: assets/serpapi-logo.svg
  dark: assets/serpapi-logo-dark.svg
  alt: SerpApi
  height: 32px
  href: index.html

favicon: assets/serpapi-icon.png

hero:
  enabled: false
  logo: false
  name: SerpApi Python
  tagline: Official Python client for SerpApi search data.
  badges: auto

homepage: index
user_guide: docs/user_guide
sections:
  - title: Examples
    dir: docs/examples
    index: true
    sidebar_groups:
      - section: Search Engines
        contents:
          - google-across-countries.md
          - bing-search.md
          - duckduckgo-search.md
          - baidu-search.md
      - section: AI Answers
        contents:
          - google-ai-overview.md
      - section: Local and Maps
        contents:
          - google-maps-local-business.md
          - google-local-services.md
      - section: Shopping and Marketplaces
        contents:
          - google-shopping-products.md
          - google-shopping-price-monitoring.md
          - amazon-product-search.md
          - walmart-product-search.md
          - ebay-product-listings.md
          - home-depot-product-search.md
      - section: Travel and Hospitality
        contents:
          - google-flights-travel.md
          - tripadvisor-travel-search.md
      - section: Finance, Trends, Jobs, and Events
        contents:
          - google-finance-market-data.md
          - google-trends-demand.md
          - google-jobs-listings.md
          - google-events-discovery.md
      - section: Media, Apps, and Research
        contents:
          - youtube-video-search.md
          - google-images-search.md
          - google-scholar-research.md
          - google-play-store-apps.md
markdown_pages: true
pre_render:
  - scripts/build_llms_txt.py
dark_mode_toggle: true

accent_color:
  light: "#377FEA"
  dark: "#38BDF8"
navbar_color:
  light: "#FFFFFF"
  dark: "#111827"

site:
  theme: flatly
  toc: true
  toc-depth: 2
  language: en
  show_dates: false
  show_author: false

include_in_header:
  - text: '<script>(function(){var m=document.querySelector("meta[name=\"quarto:offset\"]");var l=document.createElement("link");l.rel="stylesheet";l.href=(m?m.content:"")+"assets/serpapi-theme.css";document.head.appendChild(l);})();</script>'
  - text: '<script>(function(){function fixLogoHomeLink(){var m=document.querySelector("meta[name=\"quarto:offset\"]");var base=m?m.content:"";document.querySelectorAll(".navbar-brand-logo").forEach(function(a){a.setAttribute("href",base+"index.html");});}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",fixLogoHomeLink);}else{fixLogoHomeLink();}})();</script>'

changelog:
  enabled: false

skill:
  enabled: false

sidebar_filter:
  enabled: true
  min_items: 8

inline_methods: true
exclude:
  - HTTPClient
  - http
  - models
  - textui
  - utils
  - core
  - requests
  - exceptions
  - SerpResults.__getstate__
  - SerpResults.__setstate__
  - SerpResults.__repr__
  - SerpResults.from_http_response
  - http.raise_for_status
  - models.prettify_json
  - textui.prettify_json

reference:
  - title: Search Client
    desc: Main entry points for making requests and working with responses.
    contents:
      - Client
      - SerpResults

  - title: Exceptions
    desc: Errors raised by the client for API, HTTP, connection, and timeout failures.
    contents:
      - SerpApiError
      - APIKeyNotProvided
      - SearchIDNotProvided
      - HTTPError
      - HTTPConnectionError
      - TimeoutError
